<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kailu Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="home-page" style="background-color: #ffcd9e63;">

    <header id="header">
        <div>
            <a href="/index.html"><img src="/Images/EMS.svg" alt="EMS icon" id="logo"></a>
        </div>

        <nav class="navlinks">
            <a href="index.html">Intro</a>
            <a href="about.html">About</a>
            <a href="shop.html">Shop</a>
        </nav>

        <div id="cartdiv">
            <img src="/Images/cart.svg" alt="cart icon" id="carticon">
            <span id="cartspan" class="totalItemsInCart">0</span>
        </div>

    </header>

    <main>
        <div class="mainparentdiv">
            <div class="subdiv">
                <h1>THE <br> KAILU <br> STORE </h1>
            </div>
            <div class="subdiv">
                <img src="/Images/heroImage.png" alt="image of accessories">
            </div>
        </div>
        <a href="shop.html" class="btn">SHOP NOW</a>
    </main>
    <footer>
        <div id="footerDiv">
            <img src="/Images/EMS.svg" alt="EMS icon" id="logo">
        </div>
        <span id="footerSpan">.....Designed and Crafted by @Kailu.....</span>
    </footer>


    <!-- SHOPPING CART MODAL -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-container">
            <!-- ITEMS SECTION -->
            <section class="cart-items">
                <table>
                    <thead>
                        <tr>
                            <th>S/N</th>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody" class="ItemsInCart">
                        <!-- JavaScript will insert rows here -->
                    </tbody>
                </table>
            </section>
            <!-- USER DETAILS -->
            <!-- <span id="error"></span> -->
            <form id="checkoutForm" action="/" method="get">
                <section class="user-details">
                    <input type="text" placeholder="Your Name" id="name" class="inputField" required>
                    <br>
                    <input type="email" placeholder="Your Email" id="email" class="inputField">
                    <br>
                    <input type="text" placeholder="Your Phone Number" id="phone" class="inputField">
                </section>

                <!-- TOTAL -->
                <section class="total-section">
                    <p>Total Amount to be Paid</p>
                    <h2 id="totalPrice" class="totalPrice">₵0</h2>
                </section>
                <!-- ACTIONS -->
                <section class="cart-actions">
                    <button type="button" id="continueBtn">
                        Continue Shopping
                    </button>
                    <button type="submit" id="checkoutBtn">
                        Checkout
                    </button>
                </section>
            </form>
        </div>
    </div>

    <script src="products.js"></script>
    <script src="app.js"></script>
</body>

</html>
