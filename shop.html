<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kailu Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="shop-page">

    <header id="header">
        <div>
            <a href="/index.html"><img src="/Images/EMS.svg" alt="EMS icon" id="logo"></a>
        </div>

        <nav class="navlinks">
            <a href="index.html">Intro</a>
            <a href="about.html">About</a>
            <a href="shop.html">Shop</a>
        </nav>

        <div id="cartdiv">
            <img src="/Images/cart.svg" alt="cart icon" id="carticon">
            <!-- <span id="cartspan">3</span> -->
            <span id="cartspan" class="totalItemsInCart">0</span>
        </div>

    </header>

    <main>
        <h1 id="shop-title">OUR GADGETS</h1>

        <div class="gadgets" id="gadgets">
        </div>
    </main>
    <br>
    <footer>
        <div id="footerDiv">
            <img src="/Images/EMS.svg" alt="EMS icon" id="logo">
        </div>
        <span id="footerSpan">.....Designed and Crafted by @Kailu.....</span>
    </footer>
    <!-- SHOPPING CART MODAL -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-container">
            <!-- ITEMS SECTION -->
            <section class="cart-items">
                <table>
                    <thead>
                        <tr>
                            <th>S/N</th>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody">
                        <!-- JavaScript will insert rows here -->
                    </tbody>
                </table>
            </section>
            <form id="checkoutForm" action="/" method="get">
                <section class="user-details">
                    <input type="text" placeholder="Your Name" id="name" class="inputField">
                    <br>
                    <input type="email" placeholder="Your Email" id="email" class="inputField">
                    <br>
                    <input type="text" placeholder="Your Phone Number" id="phone" class="inputField">
                </section>
                <section class="total-section">
                    <p>Total Amount to be Paid</p>
                    <h2 id="totalPrice">₵0</h2>
                </section>
                <section class="cart-actions">
                    <button type="button" id="continueBtn">
                        Continue Shopping
                    </button>
                    <button type="submit" id="checkoutBtn">
                        Checkout
                    </button>
                </section>
            </form>
        </div>
    </div>
    <!-- SUMMARY MODAL -->
    <div id="summaryModal" class="summary-modal">
        <div class="summary-container">
            <h2>
                Thank You, <span id="summaryName"></span>,
                Your Order Has Been Received
            </h2>
            <img src="Images/check.svg" class="success-icon" alt="Success">
            <h3>Summary</h3>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>S/N</th>
                        <th>Item</th>
                        <th>Quantity</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <!-- Items will be added by JavaScript -->
                </tbody>
            </table>
            <button id="summaryOkBtn">Ok</button>
        </div>
    </div>
    <script src="https://js.paystack.co/v2/inline.js"></script>
    <script src="products.js"></script>
    <script src="app.js"></script>
</body>

</html>
